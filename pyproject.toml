[project]
name = "finassist-day03"
version = "0.1.0"
description = "FinAssist AI — Giorno 3: SQLAlchemy 2.0 async + Alembic + PostgreSQL"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "gunicorn>=22.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "datapizza-ai",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "tenacity>=8.3",
    "openai>=1.55",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "python-json-logger>=2.0",
    "tiktoken>=0.7",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "redis>=5.0",
    "mcp>=1.0",
    "slowapi>=0.1.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.0",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "psycopg2-binary>=2.9",  # SOLO per alembic sync
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.setuptools]
packages = ["app", "mcp_server"]