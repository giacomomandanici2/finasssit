[project]
name = "finassist-day01"
version = "0.1.0"
description = "FinAssist AI — Giorno 1: Python avanzato per backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true