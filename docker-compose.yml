services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finassist-postgres
    environment:
      POSTGRES_USER: finassist
      POSTGRES_PASSWORD: finassist_dev_password
      POSTGRES_DB: finassist
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finassist -d finassist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: finassist-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: finassist-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://finassist:finassist_dev_password@postgres:5432/finassist
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client; c=http.client.HTTPConnection('localhost',8000); c.request('GET','/health'); r=c.getresponse(); exit(0 if r.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp:
    build: .
    container_name: finassist-mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://finassist:finassist_dev_password@postgres:5432/finassist
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    command: ["uvicorn", "mcp_server.finassist_mcp:app", "--host", "0.0.0.0", "--port", "8001"]

  nginx:
    image: nginx:1.27
    container_name: finassist-nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
