services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finassist-postgres
    environment:
      POSTGRES_USER: finassist
      POSTGRES_PASSWORD: finassist_dev_password
      POSTGRES_DB: finassist
    ports:
      - "5432:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finassist -d finassist"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-service:
    build: .
    container_name: finassist-agent-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://finassist:finassist_dev_password@postgres:5432/finassist
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

volumes:
  postgres_data:
